---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@41201c8e472d212b283090605b5120d2374261b4 # main 2026-07-16
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@41201c8e472d212b283090605b5120d2374261b4 # main 2026-07-16
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@41201c8e472d212b283090605b5120d2374261b4 # main 2026-07-16
  sanity:
    uses: ansible/ansible-content-actions/.github/workflows/sanity.yaml@41201c8e472d212b283090605b5120d2374261b4 # main 2026-07-16
  unit-galaxy:
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@41201c8e472d212b283090605b5120d2374261b4 # main 2026-07-16
  unit-source:
    uses: ansible-network/github_actions/.github/workflows/unit_source.yml@20d9511bda90890aa636b5e7baa91d078dcbd143 # main 2026-07-16
    with:
      collection_pre_install: >-
        git+https://github.com/ansible-collections/ansible.utils.git
  all_green:
    if: ${{ always() }}
    needs:
      - changelog
      - build-import
      - sanity
      - unit-galaxy
      - unit-source
      - ansible-lint
    runs-on: ubuntu-latest
    steps:
      - run: >-
          python -c "assert 'failure' not in
          set([
          '${{ needs.changelog.result }}',
          '${{ needs.build-import.result }}',
          '${{ needs.sanity.result }}',
          '${{ needs.unit-galaxy.result }}',
          '${{ needs.ansible-lint.result }}',
          '${{ needs.unit-source.result }}'
          ])"
