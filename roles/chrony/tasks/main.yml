---
# tasks file for david_igou.linux_baseline.chrony

- name: Install chrony package
  ansible.builtin.package:
    name: chrony
    state: present

- name: Determine chrony config path based on distribution
  ansible.builtin.set_fact:
    chrony_config_path: "{{ '/etc/chrony/chrony.conf' if ansible_facts.distribution == 'Fedora' else '/etc/chrony.conf' }}"

- name: Configure chrony NTP servers
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^pool'
    line: "pool {{ item }} iburst maxsources 4"
    create: true
    mode: "0644"
  loop: "{{ chrony_pool_servers }}"
  notify: "Restart chronyd"

- name: Configure chrony drift file
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^driftfile'
    line: "driftfile {{ chrony_drift_file }}"
    create: true
    mode: "0644"
  notify: "Restart chronyd"

- name: Configure chrony makestep
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^makestep'
    line: "makestep {{ chrony_makestep }}"
    create: true
    mode: "0644"
  notify: "Restart chronyd"

- name: Configure chrony leapsecmode
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^leapsecmode'
    line: "leapsecmode {{ chrony_leapsecmode }}"
    create: true
    mode: "0644"
  notify: "Restart chronyd"

- name: Configure chrony log categories
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^log '
    line: "log {{ 'tracking' if chrony_log_interval == -1 else 'measurements statistics tracking' }}"
    create: true
    mode: "0644"
  notify: "Restart chronyd"

- name: Configure chrony access network
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^allow '
    line: "allow {{ chrony_access_network }}{{ chrony_access_mask }}"
    create: true
    mode: "0644"
  notify: "Restart chronyd"
  when:
    - chrony_access_network is defined
    - chrony_access_network | length > 0
    - chrony_access_ro | bool

- name: Remove stale 'restrict' lines (ntpd vocabulary; not valid in chrony.conf)
  ansible.builtin.lineinfile:
    path: "{{ chrony_config_path }}"
    regexp: '^restrict '
    state: absent
  notify: "Restart chronyd"

- name: Enable chronyd service
  ansible.builtin.service:
    name: chronyd
    enabled: true
  when: chrony_enabled | bool

- name: Try to start chronyd service
  ansible.builtin.service:
    name: chronyd
    state: started
  failed_when: false
  changed_when: false
  when: chrony_enabled | bool
