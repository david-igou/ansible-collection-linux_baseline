---
- name: Verify — auto_updates role effects
  hosts: molecule
  become: true
  gather_facts: true
  tasks:
    - name: Detect host capability
      ansible.builtin.set_fact:
        mp_has_systemd: "{{ ansible_service_mgr == 'systemd' }}"
        mp_is_container: "{{ ansible_virtualization_type in ['docker', 'podman', 'container'] }}"

    - name: Probe systemctl reachability
      ansible.builtin.command: systemctl is-system-running
      register: mp_systemctl_probe
      failed_when: false
      changed_when: false

    - name: Refine — runtime systemd available
      ansible.builtin.set_fact:
        mp_systemd_runtime: >-
          {{ mp_has_systemd and (mp_systemctl_probe.rc in [0, 1])
             and ('offline' not in (mp_systemctl_probe.stdout | default(''))) }}

    - name: Query rpm for dnf-automatic
      ansible.builtin.command: rpm -q dnf-automatic
      register: __dnfauto_pkg
      changed_when: false

    - name: Assert dnf-automatic package installed
      ansible.builtin.assert:
        that: __dnfauto_pkg.rc == 0
        fail_msg: "dnf-automatic package not installed"

    - name: Slurp /etc/dnf/automatic.conf
      ansible.builtin.slurp:
        src: /etc/dnf/automatic.conf
      register: __autocfg

    - name: Assert dnf-automatic directives written
      vars:
        _c: "{{ __autocfg.content | b64decode }}"
      ansible.builtin.assert:
        that:
          - "'upgrade_type = security' in _c"
          - "'download_updates = yes' in _c"
          - "'apply_updates = yes' in _c"
          - "'randomized_delay_sec = 3600' in _c"
        fail_msg: "Expected dnf-automatic directives not found in /etc/dnf/automatic.conf"

    - name: Gather service facts (gated)
      ansible.builtin.service_facts:
      when: not mp_is_container

    - name: Assert dnf-automatic.timer is enabled on non-container backends
      ansible.builtin.assert:
        that:
          - "'dnf-automatic.timer' in ansible_facts.services"
          - ansible_facts.services['dnf-automatic.timer'].status == 'enabled'
        fail_msg: "dnf-automatic.timer not enabled on non-container backend"
      when: not mp_is_container
