---
# mp_defaults is referenced as a bare variable inside each provisioner
# role's spec_merge (e.g. roles/docker/tasks/_spec_merge.yml). The
# dispatcher plays run on hosts: localhost, which isn't in the molecule
# group, so group_vars/molecule.yml is not loaded for them. Putting the
# backend defaults in group_vars/all.yml makes them visible to localhost.
# See david-igou/ansible-collection-molecule_provisioners issue tracker
# for the upstream bug.

mp_defaults:
  podman:
    command: /sbin/init
    systemd: always
  docker:
    command_handling: compatibility
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  kubevirt:
    namespace: molecule
    memory: 1Gi
    ssh_user: cloud-user
  qemu:
    cpus: 2
    memory: 1024
    ssh_user: cloud-user

# Cloud-init on Rocky 9 qcow2 can take >180s on first boot before sshd is
# reachable with the injected key. Bump the provisioner role's wait so
# prepare doesn't time out.
mp_qemu_wait_timeout: 300
mp_kubevirt_wait_timeout: 240
