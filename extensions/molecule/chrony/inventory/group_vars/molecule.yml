---
mp_backend: "{{ lookup('env', 'PROVISIONER') | default('podman', true) }}"

ansible_user: "{{ 'root' if mp_backend in ['podman', 'docker'] else 'cloud-user' }}"

mp_defaults:
  podman:
    command: /sbin/init
    privileged: true
    systemd: always
    cgroupns: host
  docker:
    command_handling: compatibility
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    tty: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  kubevirt:
    namespace: molecule
    memory: 1Gi
    ssh_user: cloud-user
  qemu:
    cpus: 2
    memory: 1024
    ssh_user: cloud-user
